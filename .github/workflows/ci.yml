name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Resolve the test temporary directory
        # macOS may expose TMPDIR through /var, a symlink to /private/var.
        # Cache fixtures require canonical paths, just like configured cache roots.
        run: |
          python3 - <<'PYTHON'
          import os, tempfile
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("TMPDIR=" + os.path.realpath(tempfile.gettempdir()) + "\n")
          PYTHON
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      INFINIDYSK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p infinidysk-db -p infinidysk -p infinidysk-import --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fork-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:fork-ui
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fork-ui-failure-artifacts
          path: ui/test-results

  migration-tools:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts/operations -p 'test_rust*.py'
      - run: systemd-analyze verify --man=no scripts/operations/systemd/infinidysk-rust-import@.service scripts/operations/systemd/infinidysk-rust-import@.timer scripts/operations/systemd/infinidysk-rust-batches@.service scripts/operations/systemd/infinidysk-rust-batches@.timer

  discord-announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-post-discord-messages.sh

  release-build:
    strategy:
      fail-fast: false
      matrix:
        # Native glibc builds on the same Ubuntu release as the runtime image.
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
